<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bestiary — Soul's Remnant</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="site-title">
      <span class="eyebrow">Soul's Remnant — Unofficial</span>
      <h1>Bestiary
        <svg viewBox="0 0 200 10" preserveAspectRatio="none">
          <path d="M2 6 Q 50 2, 100 6 T 198 5" stroke="#5fd3c4" stroke-width="2" fill="none" stroke-linecap="round"/>
        </svg>
      </h1>
    </div>
    <div class="header-controls">
      <div class="search-box">
        <span>🔍</span>
        <input id="searchInput" type="text" placeholder="Search by name or location…">
      </div>
      <div class="count-badge" id="countBadge"></div>
    </div>
  </header>

  <div class="layout">
    <nav class="index-pane" id="indexPane"></nav>
    <main class="detail-pane" id="detailPane"></main>
  </div>

  <footer class="site-footer">
    Fan-made reference — not affiliated with Chaomoon. Data current as of your last edit to monsters-data.js.
  </footer>

  <script src="monsters-data.js"></script>
  <script src="script.js"></script>

</html>
